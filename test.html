<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed and Grade Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 85%;
            max-width: 320px;
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; color: #bb86fc; font-size: 1.2rem; }
        .value { font-size: 2.5rem; font-weight: bold; margin: 10px 0; color: #03dac6; }
        .unit { font-size: 0.9rem; color: #9e9e9e; }
        button {
            background: #bb86fc;
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active { background: #9965f4; }
        #status { font-size: 0.8rem; color: #cf6679; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Speed</h2>
        <div id="speed" class="value">0.0</div>
        <div class="unit">mph</div>
    </div>

    <div class="card">
        <h2>Grade (Slope)</h2>
        <div id="grade" class="value">0.0</div>
        <div class="unit">%</div>
    </div>

    <div class="card" style="padding: 16px;">
        <button id="start-btn">Start Sensors</button>
        <div id="status"></div>
    </div>

    <script>
        const speedEl = document.getElementById('speed');
        const gradeEl = document.getElementById('grade');
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');

        startBtn.addEventListener('click', async () => {
            statusEl.textContent = '';
            
            // 1. Request Geolocation for Speed
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        // position.speed is in meters per second (m/s)
                        // Convert m/s to mph (multiply by 2.23694) or km/h (multiply by 3.6)
                        const speedMs = position.coords.speed;
                        if (speedMs !== null && speedMs >= 0) {
                            const speedMph = speedMs * 2.23694;
                            speedEl.textContent = speedMph.toFixed(1);
                        } else {
                            speedEl.textContent = "0.0";
                        }
                    },
                    (error) => {
                        statusEl.textContent = `GPS Error: ${error.message}`;
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                statusEl.textContent = 'Geolocation not supported.';
            }

            // 2. Request Device Orientation for Grade (Pitch)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS 13+ permission request
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    } else {
                        statusEl.textContent = 'Permission denied for orientation sensors.';
                    }
                } catch (error) {
                    statusEl.textContent = `Orientation error: ${error}`;
                }
            } else if ('ondeviceorientation' in window) {
                // Android / Standard browsers
                window.addEventListener('deviceorientation', handleOrientation);
            } else {
                statusEl.textContent += ' Device Orientation not supported.';
            }
        });

        function handleOrientation(event) {
            // event.beta represents front-to-back tilt in degrees (-180 to 180)
            // Assuming phone is mounted upright/flat relative to travel direction,
            // grade percentage can be approximated using the tangent of the pitch angle.
            const pitchDegrees = event.beta; 
            if (pitchDegrees !== null) {
                // Grade % = tan(pitch) * 100
                const radians = pitchDegrees * (Math.PI / 180);
                const gradePercent = Math.tan(radians) * 100;
                gradeEl.textContent = gradePercent.toFixed(1);
            }
        }
    </script>
</body>
</html>
